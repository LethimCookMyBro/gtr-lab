name: Private staged causal normal-motion diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'scripts/causal-*.mjs'
      - 'scripts/build-causal-driver.mjs'
      - 'scripts/diagnose-causal-motion.mjs'
      - 'tests/causal-*.node.mjs'
      - 'qa/causal-motion-request.json'
      - '.github/workflows/causal-motion-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: causal-motion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  causal-motion:
    if: github.repository == 'LethimCookMyBro/gtr-lab' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[stage-causal-motion]') && contains(github.event.head_commit.message, '[stage-dpr-motion]') && contains(github.event.head_commit.message, '[stage-cabin-integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    env:
      R35_QA_VIEWPORT: ${{ matrix.viewport }}
      R35_DPR_APP_ROOT: candidate
      R35_DPR_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      R35_MODEL_PATH: candidate/dist/models/ciasny-r35.glb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve closed source and collector pins before install, browser or server
        run: |
          node --input-type=module <<'NODE'
          import {readFile,appendFile,mkdir,writeFile} from 'node:fs/promises';
          import {validateCausalEnvironment,verifyCollectorFiles} from './scripts/causal-motion-preflight.mjs';
          const request=JSON.parse(await readFile('qa/causal-motion-request.json','utf8'));
          const resolved=validateCausalEnvironment(process.env,request);
          await verifyCollectorFiles('.',request);
          await appendFile(process.env.GITHUB_ENV,Object.entries(resolved).map(([k,v])=>`${k}=${v}\n`).join(''));
          await mkdir('causal-motion-results',{recursive:true});
          await writeFile('causal-motion-results/resolved-request.json',JSON.stringify({request,resolved,harnessCommit:process.env.GITHUB_SHA},null,2));
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R35_SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check exact candidate source before installation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {applicationIdentity} from './scripts/diagnose-dpr-motion.mjs';
          const identity=await applicationIdentity('candidate');
          assert.equal(identity.sha256,process.env.R35_EXPECTED_APP_TREE);
          NODE
          test "$(git -C candidate rev-parse HEAD)" = "$R35_SOURCE_SHA"
          test -z "$(git -C candidate status --porcelain -- src index.html package.json package-lock.json vite.config.ts server.mjs)"
      - run: npm ci
      - name: Build exact pinned application without production mutation
        working-directory: candidate
        run: npm ci && npm run build
        timeout-minutes: 8
      - name: Explicit socket-free collector tests
        run: |
          node --test tests/causal-model.node.mjs tests/causal-observer.node.mjs tests/causal-capture.node.mjs tests/causal-transport.node.mjs tests/causal-preflight.node.mjs tests/causal-policy.node.mjs tests/causal-signed-zero.node.mjs tests/causal-source-rebind.node.mjs
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Collect original normal-motion schedule and separate causal sidecar
        run: node scripts/diagnose-causal-motion.mjs
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-motion-${{ matrix.viewport }}-${{ github.sha }}
          path: causal-motion-results/
          retention-days: 14
          if-no-files-found: warn
