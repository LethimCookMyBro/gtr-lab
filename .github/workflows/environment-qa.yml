name: Geometry environment regression QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/three/**"
      - "src/data/configuration.ts"
      - "public/environments/*.json"
      - "scripts/fetch-environments.mjs"
      - "scripts/fetch-surfaces.mjs"
      - "tests/outdoor-stage-grounding.test.tsx"
      - "e2e/environment-grounding.spec.ts"
      - "playwright.environment.config.ts"
      - ".github/workflows/environment-qa.yml"
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        scenario: [studio, gallery, night, forest, coast, switching, recovery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check current geometry and camera contracts
        run: npx playwright test -c playwright.environment.config.ts --project=${{ matrix.viewport }}
        env:
          ENVIRONMENT_QA_VARIANT: candidate
          ENVIRONMENT_QA_SCENARIO: ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-grounding-candidate-${{ matrix.viewport }}-${{ matrix.scenario }}
          path: environment-grounding-results/candidate/
          retention-days: 14
