name: Photographic environment grounding QA
on:
  push:
    branches: [main]
    paths:
      - "src/components/three/**"
      - "tests/outdoor-stage-grounding.test.tsx"
      - "e2e/environment-grounding.spec.ts"
      - "playwright.environment.config.ts"
      - ".github/workflows/environment-qa.yml"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Reproduce reviewed live projection for matched before captures
        if: matrix.variant == 'baseline'
        run: git show 34f72cdd8dbbbc4093de477aeb98998c26bc3d36:src/components/three/StudioLighting.tsx > src/components/three/StudioLighting.tsx
      - name: Capture real WebGL views
        run: npx playwright test -c playwright.environment.config.ts
        env:
          ENVIRONMENT_QA_VARIANT: ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-grounding-${{ matrix.variant }}
          path: environment-grounding-results/${{ matrix.variant }}/
          retention-days: 14
