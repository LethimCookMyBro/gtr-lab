name: Reviewed live loading verification
on:
  # Automatic release checks are owned by deployment-smoke.yml.
  # This workflow is an explicit diagnostic for a reviewed deployed revision.
  workflow_dispatch:
    inputs:
      reviewed_release:
        description: "Exact 40-character SHA of the reviewed deployed release"
        required: true
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [loading, opening-cards]
    env:
      HOME_QA_URL: https://gtr-lab-production.up.railway.app
      REVIEWED_RELEASE: ${{ inputs.reviewed_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_release }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact reviewed checkout and successful deployment
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const sha = process.env.REVIEWED_RELEASE;
          assert.match(sha || '', /^[a-f0-9]{40}$/);
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(head, sha, 'Checked-out source must equal the reviewed deployed release');
          const url = process.env.HOME_QA_URL;
          const statusResponse = await fetch(`https://api.github.com/repos/LethimCookMyBro/gtr-lab/commits/${sha}/status`, { headers: { Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(20000) });
          assert.equal(statusResponse.status, 200);
          const status = (await statusResponse.json()).statuses.find(item => item.context === 'GT-R LAB - gtr-lab');
          assert.equal(status?.state, 'success');
          const page = await fetch(url, { signal: AbortSignal.timeout(20000) });
          assert.equal(page.status, 200);
          const asset = await fetch(`${url}/models/ciasny-r35.glb`, { method: 'HEAD', signal: AbortSignal.timeout(20000) });
          assert.equal(asset.status, 200);
          assert.equal(asset.headers.get('content-length'), '8296356');
          await mkdir('test-results', { recursive: true });
          await writeFile('test-results/reviewed-live-source.json', JSON.stringify({ testedSource: head, reviewedDeployedRelease: sha, url, checkoutIdentity: 'exact', railwayCommitStatus: status.state, modelBytes: 8296356 }, null, 2));
          NODE
      - run: npm ci
      - run: npm run build
      - name: Verify exact public HTML and every local JavaScript/CSS asset
        run: GITHUB_SHA="$REVIEWED_RELEASE" node scripts/verify-release-assets.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify actual live preparation and retained scene independently
        if: matrix.suite == 'loading'
        run: npx playwright test -c playwright.loading.config.ts
      - name: Verify live card containment and real pointer/keyboard actions independently
        if: matrix.suite == 'opening-cards'
        run: npx playwright test -c playwright.opening-cards.config.ts --grep "model card borders|six model cards"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-live-${{ matrix.suite }}-evidence
          path: |
            test-results/
            environment-release-verification/
            playwright-loading-report/
            playwright-opening-cards-report/
          retention-days: 14
