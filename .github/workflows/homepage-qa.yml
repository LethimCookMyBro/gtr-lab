name: Cinematic homepage QA
on:
  push:
    branches: [main]
    paths:
      - "src/pages/HomePage.tsx"
      - "src/components/home/**"
      - "src/data/films.ts"
      - "src/pages/CreditsPage.tsx"
      - "server.mjs"
      - "src/components/layout/SiteLayout.tsx"
      - "src/styles/home*.css"
      - "src/data/home-media-credits.json"
      - "public/media/**"
      - "public/films/**"
      - "filmdata/**"
      - "scripts/prepare-films.mjs"
      - "e2e/home-motion.spec.ts"
      - "e2e/rear-signature.spec.ts"
      - "e2e/rear-brand-layout.spec.ts"
      - "playwright.rear.config.ts"
      - "playwright.heritage.config.ts"
      - "playwright.exhibition.config.ts"
      - "e2e/centered-exhibition-preview.spec.ts"
      - "playwright.opening-cards.config.ts"
      - "playwright.loading.config.ts"
      - "e2e/home-loading.spec.ts"
      - "e2e/helpers/**"
      - "public/brand/**"
      - "public/fonts/**"
      - "e2e/heritage-editorial.spec.ts"
      - "e2e/home-opening-cards.spec.ts"
      - "e2e/home-hero-exit.spec.ts"
      - "playwright.hero-exit.config.ts"
      - "e2e/home-hero-viewport.spec.ts"
      - "playwright.hero-viewport.config.ts"
      - "tests/hosted-film.test.tsx"
      - "docs/film-sources/QA_PROVIDER_LIMITATION.md"
      - "playwright.home.config.ts"
      - ".github/workflows/homepage-qa.yml"
permissions:
  contents: read
concurrency:
  group: gtr-homepage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify hosted-film lifecycle without provider playback
        run: npx vitest run tests/hosted-film.test.tsx --pool=threads --maxWorkers=2 --minWorkers=1
      - name: Verify homepage layout and motion
        run: npx playwright test -c playwright.home.config.ts --grep-invert "real films advance|keeps both hosted films unloaded"
        env:
          REQUIRE_HOME_FILMS: "0"
      - name: Report external playback acceptance scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          External NissanNews/Flixel playback checks were **not exercised** by this workflow.
          The home job checks application layout, motion and iframe lifecycle; an iframe load is not proof of playback.
          The restored rear3D scene uses the unchanged published Ciasny exterior.
          Browser evidence is submitted for visual review before the release marker is changed.
          GitHub runners have received provider HTTP 403 / SAMEORIGIN responses. Do not bypass those restrictions.
          Release acceptance requires real public-origin browser playback verification; see docs/film-sources/QA_PROVIDER_LIMITATION.md for evidence and the explicit opt-in command.
          SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-homepage-evidence
          path: |
            test-results/home-motion/
            playwright-home-report/
          retention-days: 14

  component-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'exhibition' && 25 || 18 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [rear, heritage, opening-cards, hero-exit, hero-viewport, loading, exhibition]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture revised homepage component
        run: npx playwright test -c playwright.${{ matrix.suite }}.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-${{ matrix.suite }}-evidence
          path: |
            test-results/
            rear-signature-results/
            playwright-rear-report/
            playwright-opening-cards-report/
            playwright-loading-report/
            test-results/exhibition-report/
          retention-days: 14
