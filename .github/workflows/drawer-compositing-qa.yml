# Separate v2 CSS-only treatment. Original v1 failures and release gates remain untouched.
name: Staged exact Drawer compositing comparison v2
on:
  push:
    branches: [main]
    paths:
      - 'qa/drawer-compositing-request.json'
      - 'scripts/drawer-compositing-*.mjs'
      - 'tests/drawer-compositing-*.node.mjs'
      - '.github/workflows/drawer-compositing-qa.yml'
permissions:
  contents: read
concurrency:
  group: drawer-compositing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-drawer:
    if: github.repository == 'LethimCookMyBro/gtr-lab' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[stage-drawer-compositing]') && !contains(github.event.head_commit.message, '[release-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile, short, narrow, reduced]
    defaults:
      run:
        working-directory: candidate-app
    env:
      R35_ALLOW_DRAWER_COMPOSITING: '1'
      R35_DRAWER_VIEWPORT: ${{ matrix.viewport }}
      R35_DRAWER_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate-app
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: baseline-app
          ref: 8ad20d9280ac56cb77fd78df2c63eb105ebdc0a4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate-app/package-lock.json
      - name: Validate closed v2 request and both exact clean source checkouts
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {validateDrawerRequest} from './scripts/drawer-compositing-policy.mjs';
          import {verifyDrawerCheckout} from './scripts/drawer-compositing-browser.mjs';
          const request=JSON.parse(await readFile('qa/drawer-compositing-request.json','utf8'));
          validateDrawerRequest(request,process.env);
          await verifyDrawerCheckout(resolve('../baseline-app'),'baseline',request,process.env);
          await verifyDrawerCheckout(resolve('.'),'candidate',request,process.env);
          NODE
          node --check scripts/drawer-compositing-browser.mjs
          node --test tests/drawer-compositing-contract.node.mjs tests/ui-optimization-receipts.node.mjs tests/cabin-runtime-body-ledger.node.mjs
      - run: npm ci
      - name: Install exact baseline dependencies
        working-directory: baseline-app
        run: npm ci
      - name: Existing Drawer and native quality ownership regressions
        run: node node_modules/vitest/vitest.mjs run tests/drawer-compositing.test.ts tests/drawer-isolation.test.tsx tests/configurator-panel-presence.test.tsx tests/render-quality-ui.test.tsx --pool=threads --maxWorkers=1 --minWorkers=1
      - run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build exact baseline production app and assets
        working-directory: baseline-app
        run: npm run build
        timeout-minutes: 8
      - name: Build exact candidate production app and assets
        run: npm run build
        timeout-minutes: 8
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Independent baseline and candidate direct-entry Drawer lanes
        run: node scripts/drawer-compositing-browser.mjs
        timeout-minutes: 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawer-compositing-v2-${{ matrix.viewport }}-${{ github.sha }}
          path: candidate-app/drawer-compositing-results/
          retention-days: 14
          if-no-files-found: warn
