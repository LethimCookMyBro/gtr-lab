name: Staged integrated 2008 R35 proof
on:
  push:
    branches: [main]
    paths:
      - "studydata/**"
      - "scripts/*integrated-study*"
      - "e2e/integrated-r35-study.spec.ts"
      - "playwright.integrated-study.config.ts"
      - ".github/workflows/integrated-r35-study.yml"
permissions:
  contents: read
concurrency:
  group: integrated-study-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-proof:
    if: github.repository == 'LethimCookMyBro/gtr-lab' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[stage-integrated-r35-study]') && !contains(github.event.head_commit.message, '[release-')
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1440, mobile-390]
        group: [resident, settings, cancellation]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R35_INTEGRATED_STUDY_CI: "1"
      R35_INTEGRATED_STUDY_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify the exact approved parent and reviewed runtime before setup
        run: node --input-type=module -e "import {verifyIntegratedStudySource} from './scripts/integrated-study-readiness.mjs'; await verifyIntegratedStudySource(process.cwd(), process.env)"
      - run: npm ci
      - name: Validate the separate exact study transport and CPU contracts
        run: |
          node scripts/prepare-integrated-study.mjs
          node --test tests/integrated-study-observer-source.node.mjs tests/integrated-study-network.node.mjs tests/integrated-study-rear-anchor.node.mjs
          node node_modules/vitest/vitest.mjs run tests/integrated-r35-study.test.ts tests/integrated-r35-loader.test.tsx tests/integrated-r35-scene-wiring.test.tsx tests/integrated-study-transport.test.mjs tests/integrated-study-readiness.test.mjs tests/cabin-preparation-steps.test.ts tests/cabin-runtime-preparation.test.tsx tests/cabin-preparation-ui.test.tsx --pool=threads --maxWorkers=2 --minWorkers=1
          node node_modules/typescript/bin/tsc --noEmit
      - name: Build the exact checked-out source and complete baseline assets
        run: npm run build
        timeout-minutes: 8
      - name: Install Chromium in CI only
        run: node node_modules/playwright/cli.js install --with-deps chromium
        timeout-minutes: 5
      - name: Native desktop and phone proof without changing production
        run: node node_modules/playwright/cli.js test -c playwright.integrated-study.config.ts --project=${{ matrix.project }} --grep='\[${{ matrix.group }}\]'
        timeout-minutes: 11
      - name: State verification scope
        if: always()
        run: |
          echo 'Staged whole-car study only. Exact initial preparation costs and failures are retained. Inspect source-identified exterior, driver, passenger and rear images before visual acceptance. Explicit decode-delivery/native-positive-observation holds prove cancellation ownership, not loading speed. Reduced quality and reduced motion are independent settings cases. SwiftShader proof is not physical-device performance or factory-accuracy evidence. No production release marker is changed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-study-${{ github.sha }}-${{ matrix.project }}-${{ matrix.group }}
          path: |
            test-results/integrated-study/
            playwright-integrated-study-report/
          if-no-files-found: warn
          retention-days: 14
