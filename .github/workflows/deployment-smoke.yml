name: Railway live smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployment-smoke.yml'
permissions:
  contents: read
jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-vehicle.mjs
        env:
          PREVIEW_BASE_URL: https://gtr-lab-production.up.railway.app
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railway-live-browser-proof
          path: vehicle-preview-results/
          retention-days: 14
