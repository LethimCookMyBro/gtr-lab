name: Railway live smoke
on:
  push:
    branches: [main]
    paths:
      - 'release-marker.json'
permissions:
  contents: read
jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wait-railway.mjs
        timeout-minutes: 6
      - name: Verify live film bytes and range delivery
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, mkdir, writeFile } from 'node:fs/promises';
          const entries = JSON.parse(await readFile('filmdata/manifest.json', 'utf8'));
          const base = 'https://gtr-lab-production.up.railway.app';
          const results = [];
          for (const entry of entries) {
            const url = base + entry.path;
            const request = (options = {}) => fetch(url, { ...options, headers: { 'Accept-Encoding': 'identity', ...options.headers }, signal: AbortSignal.timeout(15000) });
            const head = await request({ method: 'HEAD' });
            assert.equal(head.status, 200, url + ' HEAD');
            assert.equal(head.headers.get('content-type'), 'video/mp4');
            assert.equal(Number(head.headers.get('content-length')), entry.bytes);
            assert.equal(head.headers.get('accept-ranges'), 'bytes');
            const range = await request({ headers: { Range: 'bytes=0-31' } });
            assert.equal(range.status, 206, url + ' range');
            assert.equal(range.headers.get('content-range'), `bytes 0-31/${entry.bytes}`);
            assert.equal((await range.arrayBuffer()).byteLength, 32);
            const response = await request();
            assert.equal(response.status, 200);
            const bytes = Buffer.from(await response.arrayBuffer());
            assert.equal(bytes.length, entry.bytes);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), entry.sha256);
            results.push({ url, bytes: bytes.length, sha256: entry.sha256, head: 200, range: 206 });
          }
          await mkdir('media-live-results', { recursive: true });
          await writeFile('media-live-results/transport.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          NODE
        timeout-minutes: 2
      - run: node scripts/capture-vehicle.mjs
        env:
          PREVIEW_BASE_URL: https://gtr-lab-production.up.railway.app
        timeout-minutes: 4
      - run: npx playwright test -c playwright.home.config.ts --grep "real films advance"
        env:
          HOME_QA_URL: https://gtr-lab-production.up.railway.app
          REQUIRE_HOME_FILMS: "1"
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railway-live-browser-proof
          path: |
            vehicle-preview-results/
            media-live-results/
            test-results/home-motion/
            playwright-home-report/
          retention-days: 14
