name: Railway live smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deployment-smoke.yml"
      - "scripts/capture-vehicle.mjs"
      - "scripts/wait-railway.mjs"
      - "src/**"
      - "modeldata/**"
      - "filmdata/**"
      - "public/films/**"
      - "scripts/prepare-films.mjs"
      - "release-driving-films-approved.txt"
permissions:
  contents: read
jobs:
  deployed-preview:
    if: ${{ !contains(github.event.head_commit.message, '[stage-driving-films]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wait-railway.mjs
        timeout-minutes: 6
      - name: Verify live hosted-film policy
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          const url = 'https://gtr-lab-production.up.railway.app/';
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          assert.equal(response.status, 200);
          const policy = response.headers.get('content-security-policy') || '';
          assert.ok(policy.split(';').map(value => value.trim()).includes('frame-src https://media.flixel.com'));
          await mkdir('media-live-results', { recursive: true });
          await writeFile('media-live-results/policy.json', JSON.stringify({url, status:200, policy, mode:'intact publisher-hosted embeds; no video extraction'},null,2));
          NODE
        timeout-minutes: 1
      - run: node scripts/capture-vehicle.mjs
        env:
          PREVIEW_BASE_URL: https://gtr-lab-production.up.railway.app
        timeout-minutes: 4
      - run: npx playwright test -c playwright.home.config.ts --grep "real films advance"
        env:
          HOME_QA_URL: https://gtr-lab-production.up.railway.app
          REQUIRE_HOME_FILMS: "1"
        timeout-minutes: 5
      - name: Record live 390px gradual mobile scrolling
        run: node scripts/diagnose-mobile-home-motion.mjs
        env:
          HOME_MOTION_URL: https://gtr-lab-production.up.railway.app/
          HOME_MOTION_PLAN: 390x700-normal
          HOME_MOTION_DEMO: "1"
          HOME_MOTION_OUTPUT: mobile-motion-live-390x700
        timeout-minutes: 3
      - name: Verify live 430px mobile motion
        run: node scripts/diagnose-mobile-home-motion.mjs
        env:
          HOME_MOTION_URL: https://gtr-lab-production.up.railway.app/
          HOME_MOTION_PLAN: 430x700-normal
          HOME_MOTION_OUTPUT: mobile-motion-live-430x700
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railway-live-browser-proof
          path: |
            mobile-motion-live-*/
            vehicle-preview-results/
            media-live-results/
            test-results/home-motion/
            playwright-home-report/
          retention-days: 14
