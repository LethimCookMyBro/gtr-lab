name: Railway live smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deployment-smoke.yml"
      - "scripts/capture-vehicle.mjs"
      - "scripts/diagnose-mobile-home-motion.mjs"
      - "e2e/home-motion.spec.ts"
      - "tests/hosted-film.test.tsx"
      - "playwright.home.config.ts"
      - "scripts/wait-railway.mjs"
      - "src/**"
      - "modeldata/**"
      - "filmdata/**"
      - "public/films/**"
      - "scripts/prepare-films.mjs"
      - "release-driving-films-approved.txt"
      - "release-home-story-approved.txt"
      - "release-configurator-controls-approved.txt"
      - "release-cinematic-story-approved.txt"
      - "release-heritage-exhibition-approved.txt"
      - "release-card-overflow-approved.txt"
      - "release-loading-identity-approved.txt"
permissions:
  contents: read
jobs:
  deployed-preview:
    if: ${{ !contains(github.event.head_commit.message, '[stage-driving-films]') && !contains(github.event.head_commit.message, '[stage-home-story]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify hosted-film lifecycle without provider playback
        run: npx vitest run tests/hosted-film.test.tsx --pool=threads --maxWorkers=2 --minWorkers=1
      - run: node scripts/wait-railway.mjs
        timeout-minutes: 6
      - name: Verify live hosted-film policy
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          const url = 'https://gtr-lab-production.up.railway.app/';
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          assert.equal(response.status, 200);
          const policy = response.headers.get('content-security-policy') || '';
          assert.ok(policy.split(';').map(value => value.trim()).includes('frame-src https://media.flixel.com'));
          await mkdir('media-live-results', { recursive: true });
          await writeFile('media-live-results/policy.json', JSON.stringify({url, status:200, policy, mode:'intact publisher-hosted embeds; no video extraction'},null,2));
          NODE
        timeout-minutes: 1
      - run: node scripts/capture-vehicle.mjs
        env:
          PREVIEW_BASE_URL: https://gtr-lab-production.up.railway.app
        timeout-minutes: 4
      - name: Verify live homepage layout and motion
        run: npx playwright test -c playwright.home.config.ts --grep-invert "real films advance|keeps both hosted films unloaded"
        env:
          HOME_QA_URL: https://gtr-lab-production.up.railway.app
          REQUIRE_HOME_FILMS: "0"
        timeout-minutes: 5
      - name: Verify live model card bounds and interactions
        run: npx playwright test -c playwright.opening-cards.config.ts --grep "model card borders|six model cards"
        env:
          HOME_QA_URL: https://gtr-lab-production.up.railway.app
        timeout-minutes: 5
      - name: Verify live loading and scene persistence
        run: npx playwright test -c playwright.loading.config.ts
        env:
          HOME_QA_URL: https://gtr-lab-production.up.railway.app
        timeout-minutes: 8
      - name: Record live 390px gradual mobile scrolling
        run: node scripts/diagnose-mobile-home-motion.mjs
        env:
          HOME_MOTION_URL: https://gtr-lab-production.up.railway.app/
          HOME_MOTION_PLAN: 390x700-normal
          HOME_MOTION_DEMO: "1"
          HOME_MOTION_OUTPUT: mobile-motion-live-390x700
        timeout-minutes: 3
      - name: Verify live 430px mobile motion
        run: node scripts/diagnose-mobile-home-motion.mjs
        env:
          HOME_MOTION_URL: https://gtr-lab-production.up.railway.app/
          HOME_MOTION_PLAN: 430x700-normal
          HOME_MOTION_OUTPUT: mobile-motion-live-430x700
        timeout-minutes: 3
      - name: Report external playback acceptance scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          External NissanNews/Flixel playback checks were **not exercised** by this workflow.
          This run checks application layout, motion and iframe lifecycle; an iframe load is not proof of playback.
          GitHub runners have received provider HTTP 403 / SAMEORIGIN responses. Do not bypass those restrictions.
          Release acceptance requires real public-origin browser playback verification; see docs/film-sources/QA_PROVIDER_LIMITATION.md for evidence and the explicit opt-in command.
          SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railway-live-browser-proof
          path: |
            mobile-motion-live-*/
            vehicle-preview-results/
            media-live-results/
            test-results/home-motion/
            test-results/opening-cards/
            playwright-opening-cards-report/
            playwright-home-report/
            test-results/home-loading/
            playwright-loading-report/
          retention-days: 14
