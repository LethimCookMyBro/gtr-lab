name: Vehicle visual checkpoint
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-vehicle.mjs'
      - '.github/workflows/vehicle-preview.yml'
      - 'src/**'
      - 'modeldata/**'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-vehicle.mjs
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-visual-checkpoint
          path: vehicle-preview-results/
          retention-days: 14
