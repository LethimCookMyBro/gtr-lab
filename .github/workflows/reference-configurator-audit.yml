name: Reference configurator bounded audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-reference.mjs'
      - '.github/workflows/reference-configurator-audit.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Observe public reference controls without altering the runtime
        run: node scripts/audit-reference.mjs
        timeout-minutes: 7
        env:
          REFERENCE_VIEWPORT: desktop
          REFERENCE_AUDIT_BUDGET_MS: '360000'
          REFERENCE_SCREENSHOT_TIMEOUT_MS: '40000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-configurator-bounded-evidence
          path: reference-audit-results/
          retention-days: 14
