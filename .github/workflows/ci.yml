name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx tsc --noEmit -p tsconfig.renderer-qa.json
        if: ${{ !cancelled() }}
      - run: npx playwright test -c playwright.renderer.config.ts
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-evidence
          path: |
            playwright-report/
            test-results/
            playwright-renderer-report/
            renderer-test-results/
          retention-days: 14
