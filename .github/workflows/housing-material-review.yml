name: Isolated headlamp material review
on:
  push:
    branches: [main]
    paths:
      - 'qa/renderer/housing*'
      - 'qa/renderer/main.tsx'
      - 'scripts/capture-housing-material.mjs'
      - '.github/workflows/housing-material-review.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-models.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit -p tsconfig.renderer-qa.json
      - run: npx vite build --config vite.renderer-qa.config.ts --mode renderer-qa
      - run: node scripts/capture-housing-material.mjs
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-headlamp-material-review
          path: housing-material-review-results/
          retention-days: 14
